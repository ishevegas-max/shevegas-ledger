name: Daily Civic Data Pipeline
on:
  workflow_dispatch:
jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Load Core Environment Tools
      run: pip install pdfplumber urllib3
    - name: Execute Directory Ingest Matrix
      run: python scraper.py
    - name: Commit Ledger Updates to Main
      run: |
        git config --global user.name "shevegas-bot"
        git config --global user.email "bot@shevegas.com"
        git add data/
        git diff --quiet && git diff --staged --quiet || (git commit -m "Sync direct ledger entry" && git push)